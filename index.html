<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a1a;
      color: #e0e8ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Starfield */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 55%, #cde 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 10%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 75%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 35%, #cde 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 60%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 85%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 15%, #cde 0%, transparent 100%),
        radial-gradient(1px 1px at 33% 40%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 90%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 5%  50%, #fff8 0%, transparent 100%),
        radial-gradient(2px 2px at 78% 80%, #fff6 0%, transparent 100%),
        radial-gradient(2px 2px at 48% 28%, #fff7 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #7c8db5;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      backdrop-filter: blur(6px);
    }

    /* Progress bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      border-radius: 99px;
      transition: width 0.4s ease;
    }
    .progress-label {
      font-size: 0.8rem;
      color: #7c8db5;
      white-space: nowrap;
    }

    /* Question */
    .planet-icon {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 14px;
    }
    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #dde8ff;
    }

    /* Choices */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 480px) {
      .choices { grid-template-columns: 1fr; }
      h1 { font-size: 1.6rem; }
    }

    .choice-btn {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #dde8ff;
      font-size: 0.95rem;
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      transition: background 0.18s, border-color 0.18s, transform 0.1s;
      line-height: 1.4;
    }
    .choice-btn:hover:not(:disabled) {
      background: rgba(167,139,250,0.18);
      border-color: #a78bfa;
      transform: translateY(-1px);
    }
    .choice-btn.correct {
      background: rgba(52,211,153,0.2);
      border-color: #34d399;
      color: #a7f3d0;
    }
    .choice-btn.wrong {
      background: rgba(248,113,113,0.2);
      border-color: #f87171;
      color: #fca5a5;
    }
    .choice-btn:disabled { cursor: default; }

    /* Feedback */
    .feedback {
      text-align: center;
      font-size: 0.95rem;
      min-height: 22px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .feedback.correct { color: #34d399; }
    .feedback.wrong   { color: #f87171; }

    /* Next button */
    .next-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.5px;
    }
    .next-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .next-btn:active { transform: translateY(0); }
    .next-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

    /* Results screen */
    .results { text-align: center; }
    .results .score-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: conic-gradient(#a78bfa var(--pct), rgba(255,255,255,0.08) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      position: relative;
    }
    .results .score-ring::after {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: #0f0f2a;
    }
    .results .score-num {
      position: relative;
      z-index: 1;
      font-size: 1.6rem;
      font-weight: 700;
      color: #a78bfa;
    }
    .results h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .results .verdict {
      font-size: 1rem;
      color: #7c8db5;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .restart-btn {
      display: inline-block;
      padding: 13px 36px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.5px;
    }
    .restart-btn:hover { opacity: 0.88; }

    /* Fun fact */
    .fun-fact {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #60a5fa;
      background: rgba(96,165,250,0.08);
      border: 1px solid rgba(96,165,250,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      line-height: 1.5;
    }
    .fun-fact strong { color: #93c5fd; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
const questions = [
  {
    icon: "☀️",
    question: "Approximately how many Earths could fit inside the Sun?",
    choices: ["1,300", "13,000", "1,300,000", "130,000,000"],
    answer: 2,
    fact: "The Sun makes up 99.86% of all the mass in our Solar System."
  },
  {
    icon: "🪐",
    question: "Which planet has the most moons in our Solar System?",
    choices: ["Jupiter", "Saturn", "Uranus", "Neptune"],
    answer: 1,
    fact: "Saturn has 146 confirmed moons as of 2024 — more than any other planet!"
  },
  {
    icon: "🔴",
    question: "What gives Mars its distinctive reddish color?",
    choices: ["Volcanic sulfur", "Iron oxide (rust)", "Red sand minerals", "Atmospheric haze"],
    answer: 1,
    fact: "Mars' surface is covered in iron-rich dust that has oxidized (rusted) over billions of years."
  },
  {
    icon: "💨",
    question: "Which planet rotates on its side, with an axial tilt of about 98°?",
    choices: ["Neptune", "Saturn", "Venus", "Uranus"],
    answer: 3,
    fact: "Uranus likely got knocked onto its side by a collision with an Earth-sized object long ago."
  },
  {
    icon: "🌑",
    question: "What is the largest moon in the Solar System?",
    choices: ["Europa", "Titan", "Ganymede", "Callisto"],
    answer: 2,
    fact: "Ganymede (a moon of Jupiter) is larger than the planet Mercury!"
  },
  {
    icon: "⚡",
    question: "Which planet has the fastest winds ever recorded in the Solar System?",
    choices: ["Jupiter", "Saturn", "Uranus", "Neptune"],
    answer: 3,
    fact: "Neptune's winds can reach over 2,100 km/h (1,300 mph) — the fastest in the Solar System."
  },
  {
    icon: "🌋",
    question: "Which moon of Jupiter is thought to have a subsurface liquid water ocean?",
    choices: ["Io", "Europa", "Callisto", "Amalthea"],
    answer: 1,
    fact: "Europa is one of the top candidates in the search for extraterrestrial life in our Solar System."
  },
  {
    icon: "🌞",
    question: "How long does light from the Sun take to reach Earth?",
    choices: ["About 2 minutes", "About 8 minutes", "About 30 minutes", "About 1 hour"],
    answer: 1,
    fact: "At 150 million km away, sunlight travels for ~8 minutes and 20 seconds to reach us."
  },
  {
    icon: "🪨",
    question: "Between which two planets does the Asteroid Belt lie?",
    choices: ["Earth and Mars", "Mars and Jupiter", "Jupiter and Saturn", "Saturn and Uranus"],
    answer: 1,
    fact: "Despite millions of objects, the Asteroid Belt is mostly empty space — if you combined it all, it'd be smaller than our Moon."
  },
  {
    icon: "🌀",
    question: "What is the Great Red Spot on Jupiter?",
    choices: [
      "A massive volcano",
      "A region of exposed iron ore",
      "A storm larger than Earth",
      "A crater from a comet impact"
    ],
    answer: 2,
    fact: "The Great Red Spot is a storm that has been raging for at least 350 years — though it has been shrinking."
  }
];

let current = 0;
let score = 0;
let answered = false;
let shuffled = [];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function startQuiz() {
  current = 0;
  score = 0;
  answered = false;
  shuffled = shuffle(questions);
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = shuffled[current];
  const total = shuffled.length;
  const pct = (current / total) * 100;

  document.getElementById('app').innerHTML = `
    <h1>Solar System Quiz</h1>
    <p class="subtitle">
      Test your knowledge of planets, moons, and cosmic wonders.<br>
      Choose the best answer for each question.
    </p>
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
        <span class="progress-label">Q${current+1} / ${total}</span>
      </div>
      <div class="planet-icon">${q.icon}</div>
      <div class="question-text">${q.question}</div>
      <div class="choices" id="choices">
        ${q.choices.map((c, i) => `
          <button class="choice-btn" data-idx="${i}" onclick="handleAnswer(${i})">${c}</button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" disabled onclick="handleNext()">
        ${current + 1 < total ? 'Next Question →' : 'See Results'}
      </button>
    </div>
  `;
}

function handleAnswer(chosen) {
  if (answered) return;
  answered = true;
  const q = shuffled[current];
  const buttons = document.querySelectorAll('.choice-btn');
  const feedback = document.getElementById('feedback');

  buttons.forEach(btn => btn.disabled = true);

  if (chosen === q.answer) {
    score++;
    buttons[chosen].classList.add('correct');
    feedback.textContent = '✓ Correct!';
    feedback.className = 'feedback correct';
  } else {
    buttons[chosen].classList.add('wrong');
    buttons[q.answer].classList.add('correct');
    feedback.textContent = `✗ Not quite — the answer is "${q.choices[q.answer]}"`;
    feedback.className = 'feedback wrong';
  }

  // Show fun fact
  const card = document.querySelector('.card');
  const factEl = document.createElement('div');
  factEl.className = 'fun-fact';
  factEl.innerHTML = `<strong>Fun fact:</strong> ${q.fact}`;
  card.insertBefore(factEl, document.getElementById('nextBtn'));

  document.getElementById('nextBtn').disabled = false;
}

function handleNext() {
  current++;
  if (current >= shuffled.length) {
    renderResults();
  } else {
    renderQuestion();
  }
}

function renderResults() {
  const total = shuffled.length;
  const pct = Math.round((score / total) * 100);
  const conicPct = (score / total) * 360;

  let title, verdict;
  if (pct === 100)       { title = "Perfect Score!";      verdict = "You're a true space explorer. Missions to the outer planets await you!"; }
  else if (pct >= 80)    { title = "Stellar Work!";        verdict = "You clearly have the cosmos on your mind. Just a few more facts to master."; }
  else if (pct >= 60)    { title = "Good Orbit!";          verdict = "Solid knowledge — you've got your inner planets down. Time to explore further out!"; }
  else if (pct >= 40)    { title = "Lost in Space!";       verdict = "The universe is vast and full of surprises. Give it another spin!"; }
  else                   { title = "Back to Launch Pad!";  verdict = "Every astronaut starts somewhere. Review the facts and try again!"; }

  document.getElementById('app').innerHTML = `
    <h1>Solar System Quiz</h1>
    <p class="subtitle">Quiz complete — here's how you did.</p>
    <div class="card results">
      <div class="score-ring" style="--pct:${conicPct}deg">
        <span class="score-num">${score}/${total}</span>
      </div>
      <h2>${title}</h2>
      <p class="verdict">${verdict}</p>
      <button class="restart-btn" onclick="startQuiz()">Play Again</button>
    </div>
  `;
}

startQuiz();
</script>
</body>
</html>
